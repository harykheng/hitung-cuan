    <!--
      Konten disembunyikan untuk animasi hanya kalau JavaScript jalan (lihat index.css). Kelas "motion" (landing 3)
      hanya dipasang tanpa reduced motion (tidak dipakai Landing v2).
      Kalau bundle belum jalan setelah 4 detik (gagal muat atau jaringan lambat), kelas "js" dicabut supaya semua
      konten tampil. main.tsx memasang data-hc begitu bundle berjalan.
    -->
    <script>
      document.documentElement.classList.add("js");
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("motion");
      setTimeout(function () {
        var d = document.documentElement;
        if (!d.hasAttribute("data-hc")) d.classList.remove("js", "motion");
      }, 4000);
    </script>

      data-domains: hanya mencatat di domain produksi, jadi localhost dan preview Cloudflare tidak ikut terhitung.
    -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="d672037b-49cb-4bcb-8aa6-fc19c68183b7" data-domains="hitungcuan.studioharel.id"></script>

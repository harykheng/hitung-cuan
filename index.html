    <!--
      Konten disembunyikan untuk animasi hanya kalau JavaScript jalan (lihat index.css).
      Kalau bundle belum jalan setelah 4 detik (gagal muat atau jaringan lambat), kelas "js" dicabut supaya semua
      konten tampil. main.tsx memasang data-hc begitu bundle berjalan.
    -->
    <script>
      document.documentElement.classList.add("js");
      setTimeout(function () {
        var d = document.documentElement;
        if (!d.hasAttribute("data-hc")) d.classList.remove("js");
      }, 4000);
    </script>
